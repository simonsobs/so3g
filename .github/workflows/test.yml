# In general, we try to run on:
# - The oldest supported python
# - The latest stable python that is the common default on most systems and conda
# - (During transitions) The newly released bleeding edge python

name:  Run Tests

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python-${{ matrix.python }} on ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            arch: Linux-x86_64
            ompdisable: 0
          - os: ubuntu-latest
            python: "3.12"
            arch: Linux-x86_64
            ompdisable: 0
          - os: ubuntu-latest
            python: "3.13"
            arch: Linux-x86_64
            ompdisable: 0
          - os: macos-15
            python: "3.11"
            arch: MacOSX-arm64
            ompdisable: 1
          - os: macos-15
            python: "3.13"
            arch: MacOSX-arm64
            ompdisable: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          activate-environment: test
          python-version: ${{ matrix.python }}
          miniforge-version: latest
          channel-priority: strict
          channels: conda-forge
          conda-remove-defaults: "true"

      - name: Check Conda Config
        run: |
          conda info
          conda list
          conda config --show-sources
          conda config --show

      - name: Install Dependencies
        run: |
          conda install --yes --file conda_dev_requirements.txt

      - name: Install so3g
        run: |
          python3 -m pip install -v ".[test]" -Ccmake.define.DISABLE_OPENMP=${{ matrix.ompdisable }}

      - name: Run Tests
        run: |
          export OMP_NUM_THREADS=2
          pytest ./test
